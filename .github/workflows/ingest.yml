name: Nightly article ingest

on:
  workflow_dispatch:
  schedule:
    # 09:17 UTC daily (5:17 AM EDT / 4:17 AM EST): after the UK morning news,
    # before US mornings. Off the top of the hour on purpose: GitHub delays or
    # even drops scheduled runs at busy times like :00.
    # GitHub also disables schedules after 60 days without repo activity
    # (re-enable from the Actions tab).
    - cron: '17 9 * * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Fetch, summarize, and store articles
        run: python ingest/ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
