name: Database reset (delete all articles)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete all articles" to confirm'
        required: true

jobs:
  reset:
    if: inputs.confirm == 'delete all articles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -r ingest/requirements.txt

      - run: python ingest/ingest.py --reset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
